<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Tickets</title>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/784/784121.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
  <div id="app" class="flex h-screen overflow-hidden">
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col shadow-sm md:w-64 sm:w-20 transition-all">
      <div class="p-6 border-b border-gray-200">
        <h1 class="text-2xl font-bold tracking-tight text-black-700 sm:text-xl sm:truncate">Gestão de Tickets</h1>
      </div>

      <nav class="flex-1 p-4 space-y-2">
        <button id="nav-tickets" class="nav-link w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors flex items-center gap-3 sm:justify-center sm:gap-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
          </svg>
          Chamados
        </button>

        <button id="nav-clientes" class="nav-link w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors flex items-center gap-3 sm:justify-center sm:gap-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 12H9m6 0a6 6 0 11-12 0 6 6 0 0112 0z"></path>
          </svg>
          Clientes
        </button>
      </nav>
    </aside>
    <main class="flex-1 flex flex-col overflow-hidden">
      <div id="views" class="flex-1 overflow-y-auto">
        <div id="tickets-view" class="hidden">
          <div class="p-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4">
              <h2 class="text-3xl font-bold text-gray-800">Chamados</h2>
              <button id="btn-novo-ticket" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium flex items-center gap-2 sm:w-auto w-full justify-center">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Novo Chamado
              </button>
            </div>
            <div class="bg-white p-4 rounded-lg border border-gray-200 mb-6 flex flex-col sm:flex-row gap-4">
              <div class="flex-1">
                <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                <select id="filter-status" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                  <option value="">Todos</option>
                  <option value="aberto">Aberto</option>
                  <option value="em_atendimento">Em atendimento</option>
                  <option value="aguardando_cliente">Aguardando cliente</option>
                  <option value="resolvido">Resolvido</option>
                  <option value="cancelado">Cancelado</option>
                </select>
              </div>

              <div class="flex-1">
                <label class="block text-sm font-medium text-gray-700 mb-2">Prioridade</label>
                <select id="filter-prioridade" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                  <option value="">Todas</option>
                  <option value="baixa">Baixa</option>
                  <option value="media">Média</option>
                  <option value="alta">Alta</option>
                  <option value="urgente">Urgente</option>
                </select>
              </div>

              <div class="flex items-end">
                <button id="btn-filtrar" class="w-full sm:w-auto bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors font-medium">
                  Filtrar
                </button>
              </div>
            </div>
            <div class="bg-white rounded-lg border border-gray-200 overflow-hidden overflow-x-auto">
              <div id="tickets-loading" class="hidden p-8 text-center text-gray-500">
                <p>Carregando...</p>
              </div>

              <div id="tickets-empty" class="hidden p-8 text-center text-gray-500">
                <p>Nenhum chamado encontrado.</p>
              </div>

              <table id="tickets-table" class="w-full hidden">
                <thead class="bg-gray-50 border-b border-gray-200">
                  <tr>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Protocolo</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Título</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Cliente</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Status</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Prioridade</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Data</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Ações</th>
                  </tr>
                </thead>
                <tbody id="tickets-tbody" class="divide-y divide-gray-200">
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div id="clientes-view" class="hidden">
          <div class="p-6">
            <div class="mb-6">
              <h2 class="text-3xl font-bold text-gray-800">Clientes</h2>
            </div>
            <div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
              <h3 class="text-lg font-semibold text-gray-900 mb-4">Buscar Cliente</h3>
              <div class="flex flex-col sm:flex-row gap-4">
                <div class="flex-1">
                  <label class="block text-sm font-medium text-gray-700 mb-2">ID do Cliente</label>
                  <input type="number" id="cliente-busca-id" placeholder="Digite o ID do cliente" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="flex items-end">
                  <button id="btn-buscar-cliente" class="w-full sm:w-auto bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium">
                    Buscar
                  </button>
                </div>
              </div>
              <p id="clientes-inicial-msg" class="mt-4 text-gray-600 text-center">Informe o ID de um cliente para consultar.</p>
            </div>
            <div id="clientes-detalhes-container" class="hidden">
              <div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Dados do Cliente</h3>
                <div id="clientes-detalhes" class="space-y-3">
                </div>
                <div class="mt-6 flex flex-col sm:flex-row gap-4">
                  <button id="btn-excluir-cliente" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors font-medium flex-1">
                    Excluir Cliente
                  </button>
                </div>
              </div>
            </div>
            <div id="clientes-erro" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
              <p id="clientes-erro-msg" class="text-red-700"></p>
            </div>
            <div id="clientes-loading" class="hidden bg-white rounded-lg border border-gray-200 p-8 text-center">
              <p class="text-gray-600">Carregando...</p>
            </div>
            <button id="btn-novo-cliente" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium flex items-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              Novo Cliente
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="toast" class="fixed bottom-4 right-4 hidden z-50">
    <div class="bg-white rounded-lg shadow-lg border-l-4 border-green-500 p-4 max-w-sm">
      <p id="toast-message" class="text-gray-800"></p>
    </div>
  </div>
  <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 flex items-center justify-center p-4">
    <div id="modal-content" class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
